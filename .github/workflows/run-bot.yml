name: Run bot (scheduled, no server)

# Polls Rubika every 5 minutes with `--once` and answers new Behsa_Report files.
# Needs repository secrets (Settings -> Secrets and variables -> Actions):
#   RUBIKA_BOT_TOKEN   token from @botfather            (required)
#   RUBIKA_CHAT_IDS    comma separated group chat_ids   (optional)
# and the repository variable ENABLE_SCHEDULED_BOT=true to switch it on.
# GitHub cron can be delayed by several minutes; for instant replies run the Docker image on a server.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: rubika-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    if: ${{ vars.ENABLE_SCHEDULED_BOT == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
      ALLOWED_CHAT_IDS: ${{ secrets.RUBIKA_CHAT_IDS }}
      STATE_FILE: state/state.json
    steps:
      - name: Check secret
        run: test -n "$RUBIKA_BOT_TOKEN" || (echo "::error::Secret RUBIKA_BOT_TOKEN is not set" && exit 1)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore offset state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - run: python -m bot.main --once
      - name: Save offset state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: bot-state-${{ github.run_id }}
